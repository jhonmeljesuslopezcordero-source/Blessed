<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión • BLESSED (Compra y Venta de Ropa)</title>
  <meta name="description" content="Acceso al sistema de gestión de inventario, compras y ventas de ropa BLESSED.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Encabezado con Logo Oficial de Marca -->
      <div class="auth-header">
        <div class="brand-logo-container">
          <div class="brand-icon-box">B</div>
          <span class="brand-title">BLESS<span>ED</span></span>
        </div>
        <p class="auth-subtitle">Sistema de Compra y Venta de Ropa • ADS-433</p>
      </div>

      <!-- Banner Informativo de Filtros de Seguridad y Estado de Sesión -->
      <div id="authSecurityNotice" style="display: none; background: rgba(239, 68, 68, 0.12); border: 1px solid var(--state-error); color: #fca5a5; padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 1.25rem;">
        <div style="display: flex; align-items: flex-start; gap: 0.65rem;">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink: 0; color: #ef4444; margin-top: 1px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
          <div>
            <strong style="color: #ffffff; display: block; font-size: 0.88rem; margin-bottom: 0.2rem;" id="authNoticeTitle">Filtro de Seguridad Activo</strong>
            <span id="authNoticeMsg">Debe iniciar sesión para acceder al módulo solicitado.</span>
          </div>
        </div>
      </div>

      <!-- Formulario de Inicio de Sesión -->
      <form action="dashboard.html" method="get">
        
        <!-- Campo Usuario / Correo con Icono -->
        <div class="form-group">
          <label for="usernameInput" class="form-label">
            Usuario o Correo Electrónico <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="usernameInput" 
              name="username" 
              class="form-control" 
              placeholder="ejemplo@blessed.com" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <!-- Campo Contraseña con Icono y type="password" -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">
            Contraseña Segura <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
            </span>
            <input 
              type="password" 
              id="passwordInput" 
              name="password" 
              class="form-control" 
              placeholder="••••••••••••" 
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <!-- Opciones: Recordar sesión y Recuperar Contraseña -->
        <div class="auth-options">
          <label class="form-check">
            <input type="checkbox" name="remember" id="rememberMe">
            <span>Recordar sesión</span>
          </label>
          <a href="#" onclick="alert('Se enviará un enlace de recuperación al correo registrado.'); return false;" style="font-size: 0.85rem;">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <!-- Botón Primario Rojo Institucional -->
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Ingresar al Sistema
        </button>

      </form>

      <!-- Enlace a Registro Público -->
      <div class="auth-footer">
        ¿No tienes una cuenta aún? 
        <a href="registro.html" style="font-weight: 700; color: var(--brand-primary); margin-left: 0.25rem;">
          Crear una cuenta pública
        </a>
      </div>

      <!-- Acceso Rápido a Guía de Diseño (Para el profesor) -->
      <div style="margin-top: 1.25rem; text-align: center;">
        <a href="sistema_diseno.html" class="btn btn-ghost btn-sm" style="font-size: 0.78rem;">
          🎨 Ver Sistema de Diseño (sistema_diseno.html)
        </a>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
