<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Cuenta Pública • BLESSED (Ropa & Moda)</title>
  <meta name="description" content="Crea tu cuenta pública de cliente comprador en la plataforma BLESSED.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      
      <!-- Encabezado con Logo Oficial de Marca -->
      <div class="auth-header" style="margin-bottom: 1.5rem;">
        <div class="brand-logo-container">
          <div class="brand-icon-box">B</div>
          <span class="brand-title">BLESS<span>ED</span></span>
        </div>
        <p class="auth-subtitle">Crea tu Cuenta de Cliente Comprador</p>
      </div>

      <!-- Badge de Rol Asignado por Defecto (Exigido en la Guía) -->
      <div style="background-color: var(--bg-surface-alt); padding: 0.75rem 1rem; border-radius: var(--radius-md); border-left: 3px solid var(--brand-primary); margin-bottom: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">Rol asignado al registrar:</span>
        <span class="badge badge-brand">
          <svg width="12" height="12" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
          Cliente Público / Comprador
        </span>
      </div>

      <!-- Formulario de Registro Público -->
      <form action="login.html" method="get">
        
        <!-- Nombre Completo -->
        <div class="form-group">
          <label for="fullNameInput" class="form-label">
            Nombre Completo <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
              </svg>
            </span>
            <input 
              type="text" 
              id="fullNameInput" 
              name="fullName" 
              class="form-control" 
              placeholder="Ej. Genderson Piñango" 
              required
            >
          </div>
        </div>

        <!-- Correo Electrónico -->
        <div class="form-group">
          <label for="emailInput" class="form-label">
            Correo Electrónico <span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </span>
            <input 
              type="email" 
              id="emailInput" 
              name="email" 
              class="form-control" 
              placeholder="correo@ejemplo.com" 
              required
            >
          </div>
        </div>

        <!-- Fila de Contraseñas (2 columnas en desktop, 1 en mobile) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;" class="form-row-2col">
          <div class="form-group">
            <label for="regPassInput" class="form-label">
              Contraseña <span class="required">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="regPassInput" 
                name="password" 
                class="form-control" 
                placeholder="Mínimo 8 caracteres" 
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="regPassConfirm" class="form-label">
              Confirmar Clave <span class="required">*</span>
            </label>
            <div class="input-wrapper">
              <span class="input-icon">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                </svg>
              </span>
              <input 
                type="password" 
                id="regPassConfirm" 
                name="passwordConfirm" 
                class="form-control" 
                placeholder="Repite la clave" 
                required
              >
            </div>
          </div>
        </div>

        <!-- Casilla de Aceptación de Términos (Obligatorio) -->
        <div style="margin-bottom: 1.5rem;">
          <label class="form-check">
            <input type="checkbox" name="terms" id="termsCheck" required>
            <span>He leído y acepto los <a href="#" onclick="alert('Términos y condiciones de compra de ropa BLESSED.'); return false;">términos de servicio</a> y políticas de privacidad.</span>
          </label>
        </div>

        <!-- Botón Primario Institucional -->
        <button type="submit" class="btn btn-primary btn-block" style="padding: 0.85rem; font-size: 1rem;">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
          </svg>
          Completar Registro
        </button>

      </form>

      <!-- Retorno al Login -->
      <div class="auth-footer">
        ¿Ya tienes una cuenta registrada? 
        <a href="login.html" style="font-weight: 700; color: var(--brand-primary); margin-left: 0.25rem;">
          Inicia sesión aquí
        </a>
      </div>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
